# SecureWatch: the whole stack with one command.
#
#   docker compose up -d --build     build and start everything, then open http://localhost:8080
#   docker compose ps                status (db and server should say "healthy")
#   docker compose logs -f server    follow the API and scheduler logs
#   docker compose down              stop (data is kept in the named volume)
#   docker compose down -v           stop AND delete the database
#
# For local development you can run just the database (`docker compose up -d db`)
# and start the API and dashboard with npm instead (see README.md).

name: securewatch

# ${VAR:-default} values can be overridden in a .env file next to this one.
x-database-url: &database-url postgresql://securewatch:${POSTGRES_PASSWORD:-securewatch}@db:5432/securewatch

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The default password is for local development only. A deployment sets
      # POSTGRES_PASSWORD before the first start (it is applied when the volume is created).
      POSTGRES_USER: securewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securewatch}
      POSTGRES_DB: securewatch
    ports:
      # host:container. 5432 on the host is already used by a locally installed
      # PostgreSQL service, so the container is published on 5433 instead.
      # Binding to 127.0.0.1 keeps the database off the local network: by default
      # Docker publishes on all interfaces (and on Linux it bypasses ufw rules).
      - "127.0.0.1:5433:5432"
    volumes:
      # Named volume so data survives container restarts and re-creation.
      # Postgres 18 images store data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at /var/lib/postgresql (not .../data as in <=17).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securewatch -d securewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending database migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: ./server
      target: build # the build stage contains the Prisma CLI
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  # API + scheduler. Not published on the host: only the web container talks to it.
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      # Optional: SMTP settings and other overrides from server/.env.
      - path: ./server/.env
        required: false
    environment:
      # These win over anything in server/.env.
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: *database-url
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # The dashboard (nginx), which also forwards /api to the server.
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
