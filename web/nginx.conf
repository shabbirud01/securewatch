# Serves the dashboard and forwards /api to the API container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;  # don't advertise the nginx version

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Practise what we preach: the dashboard sends the security headers SecureWatch
    # checks for. (HSTS is added by whatever terminates HTTPS in front of this, such as Caddy in deploy/.)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # A single-page app: paths such as /domains/3 are routes inside the app,
    # so any path that is not a real file gets index.html.
    location / {
        try_files $uri /index.html;
    }

    # Built assets have a content hash in their names, so they can be cached for a year.
    # ("expires" rather than add_header: an add_header here would drop the headers above.)
    location /assets/ {
        expires 1y;
    }

    # Same origin as the dashboard, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # "Scan now" waits for the scan to finish
    }
}
